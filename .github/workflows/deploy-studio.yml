# 部署 studio：推送 studio/* tag（如 studio/v0.1.0-alpha.1，由 qtcloud-devops release publish 创建）时，
# 构建 Flutter Web 产物上传到 OSS 静态网站桶，并刷新 CDN 缓存。
#
# 架构（对齐 qtdata 部署模式，运维手册见 quanttide-platform/docs/dev-guide/site-ops-handbook.md）：
#   studio/* tag → Actions（flutter build web + ossutil cp）→ OSS 桶（静态网站模式）
#   → 阿里云 CDN（delib.cloud.quanttide.com，泛域名证书 *.quanttide.com）→ 用户浏览器
#
# 触发说明：用 tag 精确匹配 studio/ 前缀，避免其他组件（provider/cli）的 Release 误触发
# （与 deploy-provider.yml 的 push tags: provider/** 模式一致）。
#
# 所需 GitHub secrets（org 级）：
#   - ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET：RAM 用户 AccessKey（OSS 上传 + CDN 刷新）
#
# 数据源：客户端内置 profile 决议标本（assets/data/*.json，前后端解耦），
# 构建产物离线可用，不依赖服务端 API。
#
# 前置条件（首次需人工在阿里云控制台完成）：
#   - OSS 桶 qtcloud-delib-studio：静态网站托管模式 + 公共读
#     （配好 CDN 回源鉴权后可将 ACL 改回私有，避免像 qtweb 一样改私有后页面空白）
#   - CDN 域名 delib.cloud.quanttide.com：CNAME 指向 CDN 加速域名，绑定泛域名证书
#   - DNS：delib.cloud.quanttide.com CNAME → CDN

name: Deploy Studio

on:
  push:
    tags:
      - 'studio/**'

concurrency:
  group: deploy-studio
  cancel-in-progress: false

env:
  OSS_BUCKET: qtcloud-delib-studio
  OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
  CDN_DOMAIN: delib.cloud.quanttide.com

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy to OSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 锁版本 3.44.8（与 qtdata 部署模板一致）：
      # 项目要求 SDK 3.12.2+，旧版 Flutter 构建会失败（qtdata 曾因本地 3.24.5 太旧阻塞）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'

      - name: Build Web
        working-directory: src/studio
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=QTCLOUD_DELIB_API_BASE_URL=${{ vars.QTCLOUD_DELIB_API_BASE_URL }} \
            --dart-define=QTCLOUD_AUTH_BASE_URL=${{ vars.QTCLOUD_AUTH_BASE_URL }}

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ env.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      # 缓存策略分离（Flutter Web 部署要点）：
      # 缓存策略：哈希产物（assets/ canvaskit/）长缓存；
      # 固定名入口文件（index.html / main.dart.js / bootstrap / SW / manifest）必须 no-cache，
      # 否则发版后浏览器拿旧 JS（main.dart.js 文件名不随内容变化）
      - name: Upload to OSS（产物长缓存）
        run: ossutil cp src/studio/build/web/ oss://${{ env.OSS_BUCKET }}/ -r -f --exclude "index.html" --exclude "main.dart.js" --exclude "flutter_bootstrap.js" --exclude "flutter.js" --exclude "manifest.json" --exclude "version.json" --meta=Cache-Control:public,max-age=31536000

      - name: Upload to OSS（入口文件 no-cache）
        run: |
          for f in index.html main.dart.js flutter_bootstrap.js flutter.js manifest.json version.json flutter_service_worker.js favicon.png; do
            ossutil cp "src/studio/build/web/$f" "oss://${{ env.OSS_BUCKET }}/$f" -f --meta=Cache-Control:no-cache
          done

      - name: Refresh CDN
        run: |
          pip install aliyun-python-sdk-cdn
          python -c "
          from aliyunsdkcore.client import AcsClient
          from aliyunsdkcdn.request.v20180510.RefreshObjectCachesRequest import RefreshObjectCachesRequest
          import os
          cli = AcsClient(os.environ['ALIYUN_ACCESS_KEY_ID'], os.environ['ALIYUN_ACCESS_KEY_SECRET'], 'cn-hangzhou')
          req = RefreshObjectCachesRequest()
          req.set_ObjectPath('https://${{ env.CDN_DOMAIN }}/')
          req.set_ObjectType('Directory')
          cli.do_action_with_exception(req)
          "
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
