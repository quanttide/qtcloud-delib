# 部署 provider：推送 tag（provider/*，如 provider/v0.1.0）时，
# 先构建发布 Docker 镜像（Docker Hub + 阿里云 ACR 双通道），再通过 Terraform apply 部署到阿里云。
#
# 镜像双通道原因：FC 中国区无法拉取 Docker Hub 镜像（registry not reachable），
# 部署用镜像固定指向同地域 ACR；Docker Hub 保留为对外分发通道。
#
# 镜像构建只编译 ./cmd/server（不依赖域级工具库 replace，普通 checkout 即可）；
# go test ./... 才需要工具库，见 ci.yml 的布局处理。
#
# 所需 GitHub secrets（org 级）：
#   - ALIYUN_ACCESS_KEY_ID / ALIYUN_ACCESS_KEY_SECRET：RAM 用户 AccessKey（terraform 用，PowerUserAccess）
#   - ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD / ALIYUN_ACR_REGISTRY：ACR 固定凭证（docker login；REGISTRY 为本实例公网地址 crpi-xxx.personal.cr.aliyuncs.com）
#   - DB_PASSWORD：RDS 数据库密码（注入 TF_VAR_db_password）
#   - DOCKERHUB_USERNAME / DOCKERHUB_PASSWORD：Docker Hub 凭证（双通道之一）
#
# 前置条件：
#   - OSS 状态桶已存在（env.TF_STATE_BUCKET）；PowerUserAccess 已含 OSS 权限
#   - ACR 仓库 quanttide/qtcloud-delib-provider 已由主账号创建（PUBLIC，FC 免凭证直拉）；
#     本 workflow 不创建仓库（CI 的 RAM 用户无 ACR 管理权限，且个人版实例的 aliyun CLI cr API 不稳定）

# 镜像构建需要 go.mod replace 的目标（域级工具库），构建上下文必须为域根布局：
# app → apps/qtcloud-delib，toolkit → packages/quanttide-delib-toolkit（与 ci.yml 一致）
name: Deploy Provider

on:
  push:
    tags:
      - 'provider/**'
  # 手动触发（重跑部署/导入种子数据，镜像 tag 默认 main）
  workflow_dispatch:
    inputs:
      image_tag:
        description: 镜像 tag（默认 main，即当前 main 构建）
        required: false
        default: main

concurrency:
  group: deploy-provider
  cancel-in-progress: false

env:
  TF_VAR_region: cn-hangzhou
  TF_VAR_environment: prod
  TF_STATE_BUCKET: quanttide-terraform-state
  TF_STATE_KEY: qtcloud-delib/terraform.tfstate
  # ACR 实例地址走 secret（ALIYUN_ACR_REGISTRY）：个人版实例专属域名属敏感信息，不写入代码
  ACR_NAMESPACE: quanttide

jobs:
  build-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      # 对齐域仓库布局（apps/qtcloud-delib），使 Dockerfile 内 replace 相对路径成立
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: apps/qtcloud-delib

      - name: Checkout toolkit（replace 依赖）
        uses: actions/checkout@v4
        with:
          repository: quanttide/quanttide-delib-toolkit
          path: packages/quanttide-delib-toolkit

      # tag provider/v0.1.0 → 镜像 tag v0.1.0；workflow_dispatch → 输入 tag（默认 main）
      - name: Resolve Image Tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${GITHUB_REF_NAME#provider/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/qtcloud-delib/src/provider/Dockerfile
          push: true
          # 关键：关闭 provenance/sbom attestation——其 manifest 平台为 unknown/unknown，
          # FC 3.0 镜像优化器会拒绝（ImageOptimizingFailed: platform of image is unknown/unknown）
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/qtcloud-delib-provider:${{ steps.image.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/qtcloud-delib-provider:latest
            ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/qtcloud-delib-provider:${{ steps.image.outputs.tag }}
            ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/qtcloud-delib-provider:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-image
    timeout-minutes: 40 # RDS 创建耗时较长
    permissions:
      contents: read
    # 生产环境保护：可在 GitHub Settings → Environments → production 配置 required reviewers（人工审批后才能 apply）
    environment: production

    env:
      ALICLOUD_ACCESS_KEY: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALICLOUD_SECRET_KEY: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      # aliyun CLI 凭证（Ensure RDS 步骤用；与 terraform 的变量名不同）
      ALICLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALICLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ALICLOUD_REGION_ID: cn-hangzhou
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 部署镜像固定指向 ACR（FC 中国区拉不到 Docker Hub）；仅写入 GITHUB_ENV，不进 job output
      - name: Resolve Image Name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${GITHUB_REF_NAME#provider/}"
          fi
          echo "TF_VAR_image=${{ secrets.ALIYUN_ACR_REGISTRY }}/${ACR_NAMESPACE}/qtcloud-delib-provider:${TAG}" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8' # 对齐本地环境

      - name: Terraform Init（OSS 远程状态）
        working-directory: manifests/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.TF_VAR_region }}"

      # 共享 RDS Serverless 空闲自动暂停（AutoPause，省钱）；暂停时 RDS 资源操作会失败/卡死，
      # 故 apply 前确保实例 Running（幂等：已 Running 则跳过；STOPPED 则启动并轮询，最长 3 分钟）
      - name: Configure aliyun CLI
        uses: aliyun/setup-aliyun-cli-action@v1
        with:
          version: '3.4.11' # 锁版本：latest 曾致 cr API 参数漂移

      - name: Ensure RDS Instance Running
        working-directory: manifests/terraform
        run: |
          set -euo pipefail
          # 已部署环境：优先从本地 state 的 platform remote state 记录取实例 ID
          INSTANCE_ID="$(terraform state pull 2>/dev/null | jq -r '.resources[] | select(.type=="terraform_remote_state" and .name=="platform") | .instances[0].attributes.outputs.value.rds_instance_id' 2>/dev/null || true)"
          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "null" ]; then
            # 首次部署：本地 state 无记录，RDS 实例已由 platform 创建（共享），按命名直接查询唤醒
            INSTANCE_ID="$(aliyun rds DescribeDBInstances --RegionId "${TF_VAR_region}" | jq -r --arg desc "quanttide-${TF_VAR_environment}" '.Items.DBInstance[] | select(.DBInstanceDescription==$desc) | .DBInstanceId' | head -1)"
            # 兜底：仅一个实例时直接使用
            if [ -z "${INSTANCE_ID}" ]; then
              INSTANCE_ID="$(aliyun rds DescribeDBInstances --RegionId "${TF_VAR_region}" | jq -r '.Items.DBInstance | if length==1 then .[0].DBInstanceId else empty end')"
            fi
            if [ -z "${INSTANCE_ID}" ]; then
              echo "::warning::未找到平台共享 RDS（期望 quanttide-${TF_VAR_environment}），跳过唤醒"
              exit 0
            fi
            echo "首次部署：按命名发现共享 RDS: ${INSTANCE_ID}"
          fi
          echo "RDS instance: ${INSTANCE_ID}"
          STATUS() { aliyun rds DescribeDBInstances --RegionId "${TF_VAR_region}" | jq -r --arg id "${INSTANCE_ID}" '.Items.DBInstance[] | select(.DBInstanceId==$id) | .DBInstanceStatus'; }
          S="$(STATUS)"
          if [ "${S}" != "Running" ]; then
            echo "实例状态 ${S}，启动中..."
            aliyun rds StartDBInstance --RegionId "${TF_VAR_region}" --DBInstanceId "${INSTANCE_ID}"
            for i in $(seq 1 12); do
              sleep 15
              S="$(STATUS)"
              echo "轮询 ${i}: ${S}"
              [ "${S}" = "Running" ] && break
            done
            # 注意：不能用 `[ x ] && { exit 1; }`——作为最后一条命令条件为假时返回 1 即脚本失败
            if [ "${S}" != "Running" ]; then
              echo "::error::RDS 实例未能在 3 分钟内启动"
              exit 1
            fi
          else
            echo "实例已 Running"
          fi

      - name: Terraform Validate
        working-directory: manifests/terraform
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: manifests/terraform
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        working-directory: manifests/terraform
        run: terraform apply -input=false -no-color tfplan

      # 生产种子数据：不自动导入——部署成功后手动上传（本地开发用 cmd/seed）
